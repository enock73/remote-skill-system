{% extends 'base.html' %}{% block content %}<h1 class="h3 mb-3">Profile</h1><div class="row g-4"><div class="col-lg-7"><form class="card p-4" method="post" enctype="multipart/form-data">{{ m.csrf() }}<input type="hidden" name="form" value="profile">
<div class="d-flex align-items-center gap-3 mb-3">{% if current_user.profile_image %}<img id="pv" class="avatar" width="72" height="72" src="{{ url_for('uploaded_file', filename=current_user.profile_image) }}" alt="">{% else %}<img id="pv" class="avatar d-none" width="72" height="72" alt="">{{ m.avatar(current_user, 72) }}{% endif %}<div><label class="form-label" for="ph">Profile photo</label><input id="ph" class="form-control" type="file" name="photo" accept="image/*" data-preview="#pv"></div></div>
<label class="form-label" for="n">Full name</label><input id="n" class="form-control mb-3" name="full_name" value="{{ current_user.full_name }}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{ current_user.email }}" disabled>
<label class="form-label" for="ph2">Phone</label><input id="ph2" class="form-control mb-3" name="phone" value="{{ current_user.phone or '' }}"><label class="form-label" for="lo">Location</label><input id="lo" class="form-control mb-3" name="location" value="{{ current_user.location or '' }}"><button class="btn btn-primary">Save profile</button></form></div>
<div class="col-lg-5"><form class="card p-4" method="post">{{ m.csrf() }}<input type="hidden" name="form" value="password"><h2 class="h6">Change password</h2><label class="form-label" for="cp">Current password</label><input id="cp" class="form-control mb-3" type="password" name="current_password" required><label class="form-label" for="np">New password</label><input id="np" class="form-control mb-3" type="password" name="new_password" required minlength="8"><button class="btn btn-outline-primary">Change password</button></form></div></div>{% endblock %}
