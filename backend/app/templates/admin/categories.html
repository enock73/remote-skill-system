{% extends 'base.html' %}{% block content %}<h1 class="h3 mb-3">Categories</h1>
<form class="card p-3 mb-4 row g-2 flex-row" method="post">{{ m.csrf() }}<div class="col-md-4"><input class="form-control" name="name" placeholder="New category name" required></div><div class="col-md-6"><input class="form-control" name="description" placeholder="Description (optional)"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add category</button></div></form>
{% for c in cats %}<form class="card p-3 mb-2 row g-2 flex-row align-items-center" method="post">{{ m.csrf() }}<input type="hidden" name="id" value="{{ c.id }}"><div class="col-md-4"><input class="form-control" name="name" value="{{ c.name }}" required aria-label="Name"></div><div class="col-md-4"><input class="form-control" name="description" value="{{ c.description or '' }}" aria-label="Description"></div><div class="col-md-1 small text-muted">{{ c.listings|length }} svc</div>
<div class="col-md-3 text-end"><button class="btn btn-sm btn-outline-primary">Save</button> <button class="btn btn-sm btn-outline-danger" name="delete" value="1" data-confirm="Delete the category '{{ c.name }}'?">Delete</button></div></form>{% else %}{{ m.empty('tags', 'No categories yet.') }}{% endfor %}{% endblock %}
