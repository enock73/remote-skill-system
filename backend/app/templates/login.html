{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="mx-auto" style="max-width:420px"><h1 class="h3 mb-3">Sign in</h1>
<form class="card p-4 needs-validation" method="post" novalidate>{{ m.csrf() }}<label class="form-label" for="e">Email</label><input id="e" class="form-control mb-3" type="email" name="email" required autocomplete="email">
<label class="form-label" for="p">Password</label><div class="input-group mb-3"><input id="p" class="form-control" type="password" name="password" required autocomplete="current-password"><button type="button" class="btn btn-outline-secondary" data-toggle-pw="#p" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
<button class="btn btn-primary w-100">Sign in</button><div class="d-flex justify-content-between mt-3 small"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a><a href="{{ url_for('auth.register') }}">Create account</a></div></form></div>{% endblock %}
